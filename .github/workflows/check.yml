name: check

# 每次 push / PR 都跑一遍：反馈纯函数与基准一致、manifest 校验（冒烟需 Windows PowerShell，留给本地跑）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 纯函数基准在另一个仓库里。checkout 进来后按路径比对，缺了会失败而不是跳过。
      - name: Checkout feedback base
        uses: actions/checkout@v4
        with:
          repository: renhao-wan/ccgui-plugin-github-trending
          path: .feedback-base

      - name: Check feedback helpers match the base copy
        env:
          FEEDBACK_BASE: ${{ github.workspace }}/.feedback-base/src/lib/feedback.mjs
        run: node scripts/check-feedback-sync.mjs

      - name: Validate manifest
        run: node scripts/validate-manifest.mjs
